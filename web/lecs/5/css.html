<html>
    <head>
        <title>CSS</title>
        <style>
            #heading1{
                color: red;
            }
            #heading2{
                color: green;
            }
            .section1{
                background-color: yellow;
            }
            .section2{
                background-color: bisque;
            }
            .section1 h1{
                color: red;
                text-align: center;
            }
        </style>
    </head> 
    <body>
        <h1 style="color:red;">Hello World</h1>
        <p style="text-align: center;">Main details</p>
        <h2 id="heading1">Sub-Heading 1</h2>
        <h2 id="heading2">Sub-Heading 2</h2>
        <div class="section1">
            <h1>Section 1</h1>
        </div>
        <div class="section2">
            <p>This is a paragraph inside section 1.</p>
        </div>
    </body>
</html>
